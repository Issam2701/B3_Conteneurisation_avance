name: Pipeline CI/CD NovaCorp

on:
  push:
    branches: [ "main" ]

jobs:
  build-validate-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Requis pour GHCR (Niveau 3)

    steps:
      # 1. Récupération du dépôt (Niveau 1)
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configuration du cache Docker (Niveau 2)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Connexion au registre GitHub (Niveau 3)
      # Utilise le token GitHub automatique, aucun mot de passe en clair !
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 4. Construction locale pour validation
      - name: Build image for testing
        uses: docker/build-push-action@v5
        with:
          context: ./02-dockerfile # <--- Adapte le chemin si besoin
          load: true
          tags: novacorp-api:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 5. Scan de sécurité Trivy (Niveau 2 & Challenge)
      # Si une faille CRITICAL est trouvée, le paramètre exit-code: '1' fait planter la CI ici. 
      # L'image ne sera donc jamais publiée (Challenge réussi).
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'novacorp-api:test'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL'

      # 6. Génération des tags dynamiques (Niveau 2)
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/novacorp-api
          tags: |
            type=sha

      # 7. Push final vers GHCR si la validation a réussi
      - name: Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./02-dockerfile # <--- Adapte le chemin si besoin
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
